[package]
name    = "lez_rln_module"
version = "6.1.1"
edition = "2021"
# u64::is_multiple_of (clippy's manual_is_multiple_of fix) stabilized in 1.87;
# the builder pins 1.94.0 (metadata.json nix.rust.toolchain).
rust-version = "1.87"

[lib]
name = "liblogos_lez_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory.
[workspace]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
# rln-layouts is the on-chain borsh wire format, pinned to the logos-lez-rln
# rev whose deployed programs it must match; bump the rev together with any
# layout change.
rln-layouts = { git = "https://github.com/logos-co/logos-lez-rln.git", rev = "a06b04455d20e129ee974f211cf3a3c6fcdb21b3" }
sha2 = "0.10"
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }

# The runtime SDK, staged by the module builder (codegen.rust) from the same
# logos-rust-sdk rev its generator came from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
serde_json = "1"
# rln (zerokit) for Poseidon: a membership's leaf is
# rate_commitment = poseidon(id_commitment, rate_limit), and the tree assigns
# the leaf index, so finding a membership's leaf means hashing its leaf and
# looking it up in the tree.
rln = { version = "3.0.0", default-features = false }
# get_fee_state / tx_included / the head block's timestamp read the sequencer
# directly (core_ffi exposes none of them); rustls so an https-only zone (the
# LEZ 0.3 testnet) can be read.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# getBlock answers the borsh block as base64.
base64 = "0.22"

[dev-dependencies]
rand_chacha = "0.3"

[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
# Ownership and borrowing in signatures
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
ptr_arg = "warn"
borrowed_box = "warn"
# Clones and allocations
implicit_clone = "warn"
unnecessary_to_owned = "warn"
iter_overeager_cloned = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
# Smart pointers and shared state
rc_buffer = "warn"
rc_mutex = "warn"
arc_with_non_send_sync = "warn"
mutex_atomic = "warn"
redundant_allocation = "warn"
box_collection = "warn"
unnecessary_box_returns = "warn"
large_enum_variant = "warn"
await_holding_lock = "warn"
# Lifetimes
needless_lifetimes = "warn"
extra_unused_lifetimes = "warn"
# Escape hatches stay documented
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
