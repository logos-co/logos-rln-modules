[package]
name    = "lez_rln_module"
version = "2.0.0"
edition = "2021"
# u64::is_multiple_of (clippy's manual_is_multiple_of fix) stabilized in 1.87;
# the builder pins 1.94.0 (metadata.json nix.rust.toolchain).
rust-version = "1.87"

[lib]
name = "liblogos_lez_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory.
[workspace]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
# rln-layouts is the on-chain borsh wire format, pinned to the logos-lez-rln
# rev whose deployed programs it must match; bump the rev together with any
# layout change.
rln-layouts = { git = "https://github.com/logos-co/logos-lez-rln.git", rev = "cdf6d6758eca2fbe3630e4635abe069dd06ee1cc" }
# Same source as the wallet below, deliberately: two git checkouts of the
# LEZ workspace both provide lee_core-0.1.0, and the nix vendor dir cannot
# hold two crates of one name and version — it fails with a bare
# "ln: ... Permission denied". The fork is v0.2.5-rc2 plus one wallet commit,
# so token_core is the same code either way.
token_core = { git = "https://github.com/adklempner/logos-execution-zone.git", rev = "8e2b119ea4e18faee58c4c469943cb1beaab742a" }
# The wallet, in-process. This module owns its own WalletCore instead of
# calling the lez_core module over lp: a host has exactly one lez_core wallet
# handle and no way to close it, so sharing it means racing every other app
# for the handle — and losing that race means inheriting a gas limit this
# module cannot read, let alone raise. The fork rev is the same one the root
# flake pins; it is the one whose wallet takes its gas limit from config.
wallet = { git = "https://github.com/adklempner/logos-execution-zone.git", rev = "8e2b119ea4e18faee58c4c469943cb1beaab742a" }
lee = { git = "https://github.com/adklempner/logos-execution-zone.git", rev = "8e2b119ea4e18faee58c4c469943cb1beaab742a" }
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }
sha2 = "0.10"
borsh = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }

# The runtime SDK, staged by the module builder (codegen.rust) from the same
# logos-rust-sdk rev its generator came from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
serde_json = "1"

# rln (zerokit) is test-only: tests recompute Poseidon tree roots and derive
# a deterministic throwaway identity. The shipped staticlib does not link it.
[dev-dependencies]
rln = { version = "3.0.0", default-features = false }
rand_chacha = "0.3"
