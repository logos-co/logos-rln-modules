name: rln-module

on:
  push:
    branches: [main]
    paths:
      - "logos-rln-module/**"
      - ".github/workflows/rln-module.yml"
  pull_request:
    paths:
      - "logos-rln-module/**"
      - ".github/workflows/rln-module.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: cargo (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      # The generated scaffold (rust-lib/generated/provider_gen.rs) and the SDK
      # source the crate path-deps are gitignored; materialise both so bare
      # cargo resolves them.
      - name: Generate the rust build inputs
        run: nix run path:./logos-rln-module#generate -L

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: logos-rln-module/rust-lib

      - name: cargo clippy
        working-directory: logos-rln-module/rust-lib
        run: cargo clippy --locked --all-targets -- -D warnings

      # The keychain tests drive the live macOS keychain; always skipped in CI.
      - name: cargo test
        working-directory: logos-rln-module/rust-lib
        run: cargo test --locked -- --skip keychain

  nix:
    name: nix build (.lgx)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # crates.io answers 403 to nixpkgs' curl fetcher on the
      # /api/v1/crates/*/download endpoint (rust-lang/crates.io#13482), so the
      # pinned nixpkgs' importCargoLock cannot download any crate the cache
      # misses. Pre-populate the exact fixed-output store paths from the static
      # CDN instead; drop this step once the module-builder nixpkgs pin fetches
      # from static.crates.io itself.
      - name: Prefetch vendored crates from the static CDN
        run: |
          python3 - <<'EOF' > /tmp/crates.txt
          import re
          lock = open("logos-rln-module/rust-lib/Cargo.lock").read()
          for s in lock.split("[[package]]"):
              name = re.search(r'^name = "([^"]+)"', s, re.M)
              ver = re.search(r'^version = "([^"]+)"', s, re.M)
              if name and ver and re.search(r'^source = "registry\+', s, re.M):
                  print(name.group(1), ver.group(1))
          EOF
          echo "prefetching $(wc -l < /tmp/crates.txt) crates"
          xargs -P 8 -n 2 bash -c 'nix store prefetch-file \
            --name "crate-${0}-${1}.tar.gz" \
            "https://static.crates.io/crates/${0}/${0}-${1}.crate" >/dev/null' \
            < /tmp/crates.txt

      - name: Build the module bundle
        run: nix build path:./logos-rln-module#lgx -L
