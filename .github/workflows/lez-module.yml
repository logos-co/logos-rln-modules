name: lez-rln-module

on:
  push:
    branches: [main]
    paths:
      - "logos-lez-rln-module/**"
      - ".github/workflows/lez-module.yml"
  pull_request:
    paths:
      - "logos-lez-rln-module/**"
      - ".github/workflows/lez-module.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: cargo (clippy, test)
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      # The generated scaffold (rust-lib/generated/provider_gen.rs) and the SDK
      # source the crate path-deps are gitignored; materialise both from the
      # locked builder so bare cargo resolves them.
      - name: Generate the rust build inputs
        run: nix run path:./logos-lez-rln-module#generate -L

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: logos-lez-rln-module/rust-lib

      - name: cargo clippy
        working-directory: logos-lez-rln-module/rust-lib
        run: cargo clippy --locked --all-targets -- -D warnings

      # The testnet tests are env-gated (LEZ_RLN_TESTNET_TESTS) and stay off in CI.
      - name: cargo test
        working-directory: logos-lez-rln-module/rust-lib
        run: cargo test --locked
