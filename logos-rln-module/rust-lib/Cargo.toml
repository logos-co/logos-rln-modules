[package]
name = "rln_module"
version = "0.16.2"
edition = "2021"
# std File::try_lock / TryLockError (keystore process lock) stabilized in 1.89.
rust-version = "1.89"

[lib]
name = "liblogos_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the table keeps cargo from adopting any workspace found
# in a parent directory. rln-signal is its own root (own lock, nix-packaged
# standalone for C/Nim consumers), so it is excluded rather than adopted.
[workspace]
exclude = ["rln-signal"]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

# Sealed-store crypto (src/sealed_store): Argon2id KDF, HKDF sub-keys,
# XChaCha20-Poly1305 AEAD.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"

# RLN zk proof generation & verification (spec generate_proof/validate_proof).
# The identity secret stays in this module — it never crosses to the sibling.
rln = { version = "3.0.0", default-features = false }

# The signal binding x = hash_to_field_le(signal), shared with consumers that
# pre-hash (generate_proof_prehashed). Inside rust-lib/ so the module
# builder's wholesale staging carries it.
rln-signal = { path = "rln-signal" }

# ChaCha20Rng for zerokit's seeded keygen (the RNG is chosen at type level).
rand_chacha = "0.3"

# The runtime SDK, staged by the module builder (codegen.rust) from the same
# logos-rust-sdk rev its generator came from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
# Ownership and borrowing in signatures
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
ptr_arg = "warn"
borrowed_box = "warn"
# Clones and allocations
implicit_clone = "warn"
unnecessary_to_owned = "warn"
iter_overeager_cloned = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
# Smart pointers and shared state
rc_buffer = "warn"
rc_mutex = "warn"
arc_with_non_send_sync = "warn"
mutex_atomic = "warn"
redundant_allocation = "warn"
box_collection = "warn"
unnecessary_box_returns = "warn"
large_enum_variant = "warn"
await_holding_lock = "warn"
# Lifetimes
needless_lifetimes = "warn"
extra_unused_lifetimes = "warn"
# Escape hatches stay documented
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
