[package]
name = "rln_module"
version = "0.14.0"
edition = "2021"
# std File::try_lock / TryLockError (keystore process lock) stabilized in 1.89.
rust-version = "1.89"

[lib]
name = "liblogos_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory.
[workspace]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

# Sealed-store crypto (src/sealed_store): Argon2id KDF, HKDF sub-keys,
# XChaCha20-Poly1305 AEAD.
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"

# RLN zk proof generation & verification (spec generate_proof/validate_proof).
# The identity secret stays in this module — it never crosses to the sibling.
rln = { version = "3.0.0", default-features = false }

# ChaCha20Rng for zerokit's seeded keygen (the RNG is chosen at type level).
rand_chacha = "0.3"

# The zone query's request/response cross libp2p_module's protocolRequest as
# base64 (src/zone.rs), as the gifter's do.
base64 = "0.22"
# A zone service named by URL (development) is the membership zone indexer's
# JSON API, read with GETs (src/zone.rs); rustls so an https service can be
# reached. The client the LEZ module uses for its sequencer reads.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# The runtime SDK, staged by the module builder (codegen.rust) from the same
# logos-rust-sdk rev its generator came from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
# The tree the membership zone builds (OptimalMerkleTree), so a test can prove
# against the indexer's own paths.
zerokit_utils = { version = "3.0.0", default-features = false }
