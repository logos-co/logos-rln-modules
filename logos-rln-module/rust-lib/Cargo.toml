[package]
name    = "rln_module"
version = "0.4.0"
edition = "2021"

[lib]
name = "liblogos_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory.
[workspace]

# Panicking across the FFI boundary is UB; mirror the sibling module's setting.
[profile.release]
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keystore crypto (WAKU-RLN-KEYSTORE: PBKDF2-HMAC-SHA256 + AES-128-CTR +
# keccak256 MAC — the format the spec's own test vector actually uses, i.e.
# the Ethereum-V3/nim-eth keyfile construction; the spec PROSE says SHA256
# but its vector disagrees — see keystore.rs) — all pure Rust.
sha2 = "0.10"
sha3 = "0.10"
aes = "0.8"
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

# RLN zk proof generation & verification (spec generate_proof / verify_proof).
# Still v2 while the sibling liblogos_lez_rln_module and lez-rln are on v3 —
# byte-compatible (identical seeded keygen, Poseidon params, circuit
# resources); migrate deliberately. We use the full stateless proving API
# (keygen+poseidon is not enough), so the identity secret stays in this
# module — it never crosses to the sibling.
rln = { version = "2.0.2", default-features = false, features = ["stateless"] }

# The runtime SDK, staged by the module builder (codegen.rust) at this
# path from the same logos-rust-sdk rev its generator came from. Keep the
# stage-sources.sh pin identical to ../../logos-lez-rln-module's.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
