[package]
name = "rln_module"
version = "0.5.0"
edition = "2021"
# std File::try_lock / TryLockError (keystore process lock) stabilized in 1.89.
rust-version = "1.89"

[lib]
name = "liblogos_rln_module"
crate-type = ["staticlib"]

# Standalone crate: the empty table keeps cargo from adopting any workspace
# found in a parent directory.
[workspace]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The domain-agnostic keystore layer (V3-keyfile envelope + durable-file
# primitives), a subcrate INSIDE this directory so the module-builder's
# staging (which copies rust-lib/ wholesale) carries it. rust-lib's own
# [workspace] table adopts it as a member — the subcrate must not carry a
# [workspace] of its own.
logos-keystore-core = { path = "keystore-core" }

# Sidecar-MAC crypto (HMAC-SHA256 over the AllocationState payload); the
# envelope crypto itself (PBKDF2/AES-CTR/keccak) lives in logos-keystore-core.
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

# RLN zk proof generation & verification (spec generate_proof/verify_proof).
# The identity secret stays in this module — it never crosses to the sibling.
rln = { version = "3.0.0", default-features = false }

# ChaCha20Rng for zerokit's seeded keygen (the RNG is chosen at type level).
rand_chacha = "0.3"

# The runtime SDK, staged by the module builder (codegen.rust) from the same
# logos-rust-sdk rev its generator came from. Keep the stage-sources.sh pin
# in ../../logos-lez-rln-module identical.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
