[package]
name = "rln-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The RLN signal binding x = hash_to_field_le(signal), as a library and a one-symbol C ABI"
license = "MIT OR Apache-2.0"

[lib]
name = "rln_signal"
crate-type = ["rlib", "staticlib", "cdylib"]

# Standalone root: the parent rust-lib workspace excludes this directory so
# the crate builds (and is packaged by nix) on its own, with its own lock.
[workspace]

# Panicking across the FFI boundary is UB.
[profile.release]
panic = "abort"

[dependencies]
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }

[dev-dependencies]
# Equality oracle only: the pinned construction must stay byte-identical to
# zerokit's hash_to_field_le.
rln = { version = "3.0.0", default-features = false }

[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
# Ownership and borrowing in signatures
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
ptr_arg = "warn"
borrowed_box = "warn"
# Clones and allocations
implicit_clone = "warn"
unnecessary_to_owned = "warn"
iter_overeager_cloned = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
# Smart pointers and shared state
rc_buffer = "warn"
rc_mutex = "warn"
arc_with_non_send_sync = "warn"
mutex_atomic = "warn"
redundant_allocation = "warn"
box_collection = "warn"
unnecessary_box_returns = "warn"
large_enum_variant = "warn"
await_holding_lock = "warn"
# Lifetimes
needless_lifetimes = "warn"
extra_unused_lifetimes = "warn"
# Escape hatches stay documented
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
