[package]
name = "keystore-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
aes = "0.8"
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
zeroize = "1"
getrandom = "0.2"
