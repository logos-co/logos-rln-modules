# NOTE: no [workspace] table in this manifest — the parent rust-lib crate's
# own [workspace] adopts this path dependency as a member automatically, and
# a nested workspace root is a hard cargo error.

[package]
name = "logos-keystore-core"
version = "0.1.0"
edition = "2021"
# Matches the parent crate's MSRV (driven by std File::try_lock, 1.89).
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The V3-keyfile envelope: PBKDF2-HMAC-SHA256 + AES-128-CTR + keccak256 MAC.
sha2 = "0.10"
sha3 = "0.10"
aes = "0.8"
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
zeroize = "1"
getrandom = "0.2"
