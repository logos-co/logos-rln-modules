# Shared build flags for the PoC binaries.
#
# - orc + useMalloc: one allocator story across the Rust/Nim boundary; safe
#   cross-thread frees.
# - threads: the lp shim runs a worker pool; module callbacks arrive on
#   Rust-owned threads.
# - Linux needs -rdynamic so the host executable's lp_* exports land in
#   .dynsym for the dlopen'd module cdylibs to resolve (macOS executables
#   export globals by default).

--threads:on
--mm:orc
-d:useMalloc

@if linux:
  passL = "-rdynamic"
  passL = "-ldl"
@end
